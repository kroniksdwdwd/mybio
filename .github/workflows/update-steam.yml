name: Update Steam profile data

# GitHub-раннеры не ограничены CORS, поэтому скрипт может напрямую
# читать XML-профиль Steam и складывать свежие данные в репозиторий.
# Сайт использует src/data/steamProfile.json как основной источник.

on:
  schedule:
    - cron: '23 */6 * * *'   # каждые 6 часов
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Steam profile
        run: node scripts/fetch-steam.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/steamProfile.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update steam profile data"
            git push
          else
            echo "Данные не изменились"
          fi
