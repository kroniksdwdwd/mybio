name: Update Steam status

# Каждые 5 минут проверяем Steam и публикуем steam-status.json
# в ветку status. Сайт читает этот файл напрямую с GitHub —
# так статус всегда свежий и не упирается в CORS.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Steam status
        run: node scripts/fetch-steam.mjs

      - name: Publish to status branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan status
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add steam-status.json
          git commit -m "chore: steam status"
          git push --force origin status
