name: Update social avatars

# Скрипт скачивает аватарки площадок (Twitch, YouTube, Spotify, ...)
# в public/avatars/ и обновляет src/data/socialAvatars.json.
# Сайт сам ходить на эти сайты не может — CORS.

on:
  schedule:
    - cron: '41 */12 * * *'   # каждые 12 часов
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch avatars
        run: node scripts/fetch-avatars.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars src/data/socialAvatars.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update social avatars"
            git push
          else
            echo "Аватарки не изменились"
          fi
